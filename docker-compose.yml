services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    container_name: qdrant
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:0.30.10
    restart: unless-stopped
    container_name: ollama

    ports:
      - 11434:11434
    expose:
      - 11434
    volumes:
      - ./ollama_data:/ollama/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

configs:
  qdrant_config:
    content: |
      log_level: INFO